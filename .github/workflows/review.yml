name: Owner staging security and regression validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: owner-staging-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Standard hosted runners are free for this public repository.
    # Automatic execution is limited to the authorised owner staging preparation branch.
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/owner-staging-preparation' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: TypeScript checks
        run: npm run typecheck
        timeout-minutes: 2
      - name: Unit and API tests
        run: npm test
        timeout-minutes: 2
      - name: Production build
        run: npm run build
        timeout-minutes: 2
      - name: Build staging container without publishing or deploying
        run: |
          docker build --file deploy/staging/Dockerfile --tag jr-owner-staging:ci .
          docker run --rm --entrypoint /usr/local/bin/cloudflared jr-owner-staging:ci --version
          if docker run --rm jr-owner-staging:ci; then
            echo 'Staging must fail closed without explicit configuration'
            exit 1
          fi
        timeout-minutes: 5
      - name: Development server smoke test
        run: npm run test:dev
        timeout-minutes: 2
      - run: npx playwright install --with-deps chromium
      - name: Existing, tender and approval-gate browser workflows
        run: npm run test:browser && node tests/staging-browser.mjs
        timeout-minutes: 3
      - name: Install PDF validation tools
        run: sudo apt-get install -y poppler-utils
      - name: PDF text, totals and printable bounds
        run: npm run test:pdf
        timeout-minutes: 2
      # No cache saves or artifact uploads: no billable Actions storage is created.
