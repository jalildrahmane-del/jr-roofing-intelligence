name: Issue 1 review validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: issue-1-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Standard hosted runner is free only while this repository is public.
    # PR-triggered validation is limited to the currently authorised PR #6.
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 6) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build && npm run test:dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # No cache saves or artifact uploads: no billable Actions storage is created.
