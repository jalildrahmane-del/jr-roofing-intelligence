name: Integration validation

on:
  push:
    branches:
      - feature/owner-command-centre-expansion
  pull_request:
    branches:
      - feature/document-ai-safe-gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jr-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, unit, build, browser and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run full integration validation
        run: npm run validate
